name: Deploy

# Deploys main to Cloudflare: database migrations first, then the Worker.
# Inactive until the repository variable DEPLOY_ENABLED is set to "true" (see RUNBOOK.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a second push waits for the first to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      CLOUDFLARE_ENV: ''
      # Public values baked into the build (NEXT_PUBLIC_* are compiled into the site).
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npm run deploy:database

      - name: Build and deploy the Worker
        run: npm run deploy:app

      - name: Smoke test
        run: |
          for path in / /rent /calendar /donate /contact /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
